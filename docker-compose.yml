services:
  mongo:
    image: mongo:8.0
    container_name: equipment-ledger-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the single-node replica set the first time the container comes up.
      # The member host is localhost so both the host machine and the container can reach it.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 5s

volumes:
  mongo-data:
